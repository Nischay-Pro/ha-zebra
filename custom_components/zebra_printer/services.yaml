print:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zebra_printer
    zpl:
      required: true
      example: |-
        ^XA
        ^FO40,40^A0N,40,40^FDHello from Home Assistant^FS
        ^XZ
      selector:
        text:
          multiline: true
set_media_roll:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: zebra_printer
    roll_length_inches:
      required: true
      example: 1000
      selector:
        number:
          min: 0.1
          step: 0.1
          unit_of_measurement: in
          mode: box
    remaining_length_inches:
      required: false
      example: 800
      selector:
        number:
          min: 0
          step: 0.1
          unit_of_measurement: in
          mode: box
