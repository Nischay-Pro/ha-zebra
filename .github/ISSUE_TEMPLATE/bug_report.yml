name: Bug report
description: Report a reproducible problem with the Zebra Printer integration
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before opening a new one. Do not include printer IP addresses, serial numbers, passwords, webhook IDs, or other private information.

  - type: dropdown
    id: area
    attributes:
      label: Where does the issue occur?
      options:
        - Setup or discovery
        - Sensor readings
        - Printer controls
        - ZPL printing
        - Media roll estimate
        - Printer event alerts
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and include any error message.
      placeholder: A clear description of the issue.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that make the issue happen.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe the expected behavior.
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: For example, 2026.9.0
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Zebra Printer integration version
      placeholder: Find this in the integration details in HACS.
    validations:
      required: true

  - type: input
    id: printer_model
    attributes:
      label: Printer model
      placeholder: For example, ZD420
    validations:
      required: true

  - type: input
    id: printer_firmware
    attributes:
      label: Printer firmware version
      placeholder: Leave blank if unknown.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste related Home Assistant logs, after removing private information and secrets.
      render: text
    validations:
      required: false
